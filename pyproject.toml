[project]
name = "agente-investimento"
version = "0.0.1"
description = "Agente de Investimento usando LLMs"
authors = [
    { name = "Jeferson Dionei Sehnem" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langchain==0.3.25",
    "langsmith==0.3.43",
    "groq==0.11.0",
    "pydantic>=2.10,<3.0",
    "ipykernel==6.29.5",
    "ipython==8.29.0",
    "langchain-core>=0.3.23",
    "langchain-groq==0.2.1",
    "langchain-community==0.3.20",
    "langchain-text-splitters==0.3.8",
    "langgraph==0.3.30",
    "httpx==0.27.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pillow==10.4.0",
    "protobuf==5.28.3",
    "pyarrow==18.0.0",
    "pydantic-core>=2.27.0",
    "pydeck==0.9.1",
    "pygments==2.18.0",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "streamlit==1.39.0",
    "tzdata==2024.2",
    "urllib3==2.2.3",
    "linkup-sdk==0.2.3",
    "langchain-linkup==0.1.5",
    "pytest==7.1.3",
    "black==25.1.0",
    "pytest-cov==4.0.0",
    "pylint==3.3.4",
    "mypy==1.15.0",
    "pyright==1.1.393",
    "langchain-tests==0.3.4",
    "pandas-stubs==2.2.3.241126",
    "ruff==0.9.6",
    "snscrape==0.7.0.20230622",
    "selenium==4.22.0",
    "webdriver-manager==4.0.2",
    "undetected-chromedriver==3.5.5",
    "aiohttp==3.11.11",
    "beautifulsoup4==4.13.3",
    "yfinance==0.2.58",
    "unidecode==1.3.8",
    "finta==1.3",
    "ipeadatapy==0.1.9",
    "sidrapy==0.1.4",
    "types-requests==2.32.0.20241016",
    "tabulate==0.9.0",
    "chromedriver-py==134.0.6998.88",
    "html2text",
    "lxml==5.3",
    "crawl4ai==0.6.0",
    "isort",
    "flask",
    "fastapi",
    "uvicorn",
    "langchain-docling",
    "sqlalchemy==2.0.40",
    "psycopg",
    "langgraph-checkpoint-postgres==2.0.21",
    "psycopg-pool",
    "psycopg-binary",
    "pyinstrument",
    "yfinance-cache",
    "requests-cache",
    "better-profanity",
    "openai==1.77.0",
    "llm-guard",
    "openevals",
    "pytest-asyncio>=0.23.8",
]

[project.optional-dependencies]
dev = [
    "mypy==1.15.0",
    "ruff==0.9.6",
    "pytest==7.1.3",
    "pytest-cov==4.0.0",
    "black==25.1.0"
]

[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agente_investimento"]
[tool.setuptools.package-dir]
"agente_investimento" = "agente_investimento"

[tool.ruff]
select = ["E", "F", "B"]
ignore = []
line-length = 88
target-version = "py310"

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true
max-doc-length = 100
max-line-length = 500
#ignore-one-line-docstrings = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=agente_investimento"

[tool.pyrefly]
permissive-ignores = "True"
use-untyped-imports = "True"
